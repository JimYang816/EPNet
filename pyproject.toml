[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epnet"
version = "0.1.0"
description = "WATERMARK NCS1/NOF1 P-D-D-P receiver with fixed shared DPSS, joint CSI, and MMSE/EP equalization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "h5py>=3.10", "matplotlib>=3.8", "threadpoolctl>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
gpu = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["data_generation*", "src*"]

[tool.pytest.ini_options]
testpaths = ["data_generation/tests", "tests"]
pythonpath = ["."]
